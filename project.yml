name: DroidBridge
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  DroidBridgeShared:
    path: macos/Shared
targets:
  DroidBridgeHelper:
    type: tool
    platform: macOS
    sources:
      - path: macos/Helper
        excludes:
          - Info.plist
          - Helper.entitlements
          - io.droidbridge.helper.plist
      - path: macos/CoreHost
    dependencies:
      - package: DroidBridgeShared
      - target: DroidBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.droidbridge.helper
        CODE_SIGN_ENTITLEMENTS: macos/Helper/Helper.entitlements
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: macos/Helper/Info.plist
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/core/include
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/core/include
        OTHER_SWIFT_FLAGS: [-Xcc, -fmodule-map-file=$(SRCROOT)/core/include/module.modulemap]
  DroidBridgeCore:
    type: library.static
    platform: macOS
    sources:
      - path: core/src
      - path: core/ports/lwip_port.c
      - path: core/third_party/lwip/src/core
        excludes: ["ipv6/**"]
      - path: core/third_party/lwip/src/netif/ethernet.c
      - path: core/include/module.modulemap
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/core/include
          - $(SRCROOT)/core/ports
          - $(SRCROOT)/core/third_party/lwip/src/include
        MODULEMAP_FILE: core/include/module.modulemap
        DEFINES_MODULE: NO
        OTHER_CFLAGS: [-Wno-everything]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SWIFT_VERSION: "6.0"
  DroidBridgeHost:
    type: application
    platform: macOS
    sources:
      - macos/HostApp
      - path: macos/Helper/io.droidbridge.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: DroidBridgeShared
      - target: DroidBridgeHelper
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchDaemons
    info:
      path: macos/HostApp/Resources/Info.plist
      properties:
        LSUIElement: true
        SMPrivilegedExecutables:
          io.droidbridge.helper: 'identifier "io.droidbridge.helper" and anchor apple generic and certificate leaf[subject.OU] = "$(DEVELOPMENT_TEAM)"'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.droidbridge.macos
        PRODUCT_NAME: DroidBridge
        CODE_SIGN_ENTITLEMENTS: macos/HostApp/Resources/HostApp.entitlements
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
  DroidBridgePacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - macos/PacketTunnel
      - macos/CoreHost
    dependencies:
      - package: DroidBridgeShared
      - target: DroidBridgeCore
      - sdk: NetworkExtension.framework
    info:
      path: macos/PacketTunnel/Resources/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.droidbridge.macos.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: macos/PacketTunnel/Resources/PacketTunnel.entitlements
        SWIFT_VERSION: "6.0"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/core/include
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/core/include
        OTHER_SWIFT_FLAGS: [-Xcc, -fmodule-map-file=$(SRCROOT)/core/include/module.modulemap]
